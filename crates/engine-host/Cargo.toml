[package]
name = "ubar-engine-host"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[lib]
name = "ubar_engine"
crate-type = ["cdylib", "rlib"]

[features]
developer-extensions = []

[dependencies]
libloading = "0.8"
serde_json = "1"
ubar-browser-core = { path = "../browser-core" }
ubar-engine-abi = { path = "../engine-abi" }
ubar-drm-host = { path = "../drm-host" }
ubar-extension-host = { path = "../extension-host" }
