[package]
name = "ubar-drm-host"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
aes = "0.8"
base64 = "0.22"
ctr = "0.9"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
