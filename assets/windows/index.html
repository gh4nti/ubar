<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="tabs">
    <div id="tab-strip"><button id="new" title="New tab">+</button></div>
    <div id="drag-region"></div>
    <div id="window-controls">
      <button data-command="window-minimize" title="Minimize">&#x2212;</button>
      <button data-command="window-maximize" title="Maximize">&#x25a1;</button>
      <button class="window-close" data-command="window-close" title="Close">&#xd7;</button>
    </div>
  </div>
  <div id="nav">
    <button data-command="back" title="Back">&#x2190;</button>
    <button data-command="forward" title="Forward">&#x2192;</button>
    <button data-command="reload" title="Reload">&#x21bb;</button>
    <button data-command="home" title="Home">&#x2302;</button>
    <input id="address" aria-label="Address" autocomplete="off" spellcheck="false">
    <div id="extension-actions" aria-label="Extensions"></div>
    <button id="bookmark" title="Bookmark">&#x2606;</button>
    <button id="downloads" title="Downloads" aria-expanded="false" hidden>&#x2193;</button>
    <button id="more" title="More">&#x22ef;</button>
  </div>
  <div id="app-menu" hidden>
    <div class="zoom-controls" aria-label="Page zoom">
      <button data-command="zoom-out" title="Zoom out">&#x2212;</button>
      <button id="zoom-value" data-command="zoom-reset" title="Reset zoom">100%</button>
      <button data-command="zoom-in" title="Zoom in">+</button>
    </div>
    <button data-page="home">Home</button>
    <button data-command="incognito">New Incognito</button>
    <button data-page="history">History</button>
    <button data-page="bookmarks">Bookmarks</button>
    <button data-page="downloads">Downloads</button>
    <button data-command="reading-mode">Reader</button>
    <button data-command="task-manager">Tasks</button>
    <button data-page="extensions">Extensions</button>
    <button data-page="settings">Settings</button>
  </div>
  <div id="downloads-panel" hidden>
    <div class="downloads-header">Downloads</div>
    <div id="downloads-list"></div>
    <button id="downloads-all">Show all downloads</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
