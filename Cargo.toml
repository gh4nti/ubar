[package]
name = "ubar"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
glib = "0.22"
gtk4 = { version = "0.11", features = ["v4_10"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webkit6 = "0.6"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
